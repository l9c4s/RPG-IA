# Debug override — usar junto com docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# Cada serviço Python escuta debugpy (DAP) em porta dedicada.
# No VS Code: Run > "Python: Remote Attach" apontando para localhost:PORT.
#
# ATENÇÃO: --reload removido (conflita com debugger).
# Mude código e dê docker compose restart <serviço> para recarregar.

services:

  # ── Gateway — DAP :5678 ─────────────────────────────────────────────────────
  gateway:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5678 -m uvicorn presentation.main:app --host 0.0.0.0 --port 8000 --log-level debug"]
    ports:
      - "5678:5678"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── PDF Service — DAP :5679 ─────────────────────────────────────────────────
  pdf_service:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5679 -m uvicorn presentation.main:app --host 0.0.0.0 --port 8001 --log-level debug"]
    ports:
      - "5679:5679"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── Campaign Service — DAP :5680 ────────────────────────────────────────────
  campaign_service:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5680 -m uvicorn presentation.main:app --host 0.0.0.0 --port 8002 --log-level debug"]
    ports:
      - "5680:5680"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── Character Service — DAP :5681 ───────────────────────────────────────────
  character_service:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5681 -m uvicorn presentation.main:app --host 0.0.0.0 --port 8003 --log-level debug"]
    ports:
      - "5681:5681"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── Image Service — DAP :5682 ───────────────────────────────────────────────
  image_service:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5682 -m uvicorn presentation.main:app --host 0.0.0.0 --port 8004 --log-level debug"]
    ports:
      - "5682:5682"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── TTS Service — DAP :5683 ─────────────────────────────────────────────────
  tts_service:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5683 -m uvicorn presentation.main:app --host 0.0.0.0 --port 8005 --log-level debug"]
    ports:
      - "5683:5683"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # ── Celery Worker — DAP :5684 ───────────────────────────────────────────────
  # --pool=solo  → tasks rodam no processo principal (obrigatório para breakpoints)
  # --loglevel=debug → output completo de cada task
  celery_worker:
    command: ["sh", "-c", "pip install debugpy -q && python -m debugpy --listen 0.0.0.0:5684 -m celery -A infrastructure.worker.celery_app worker --loglevel=debug --pool=solo -Q pdf_processing"]
    ports:
      - "5684:5684"
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
