worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker interno resolve nomes de container — re-resolve a cada 10s
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    server {
        listen 80;
        server_name _;

        # Variáveis forçam o nginx a usar o resolver dinamicamente
        set $upstream_gateway     gateway;
        set $upstream_campaign    campaign_service;
        set $upstream_pdf         pdf_service;
        set $upstream_character   character_service;
        set $upstream_minio       minio;
        set $upstream_frontend    frontend;

        # Frontend
        location / {
            proxy_pass         http://$upstream_frontend:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # PDF upload — rate limit restrito só para o endpoint de upload
        location /api/books/upload {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 100M;
            rewrite ^/api/books/(.*) /$1 break;
            proxy_pass         http://$upstream_pdf:8001;
            proxy_set_header   Host $host;
            proxy_read_timeout 120s;
        }

        # PDF knowledge reads — rate limit normal de API
        location /api/books/ {
            limit_req zone=api burst=30 nodelay;
            rewrite ^/api/books/(.*) /$1 break;
            proxy_pass         http://$upstream_pdf:8001;
            proxy_set_header   Host $host;
            proxy_read_timeout 120s;
        }

        # Characters por campanha — ANTES da regra de campaign (mais específica)
        location ~ ^/api/campaigns/[^/]+/characters(/.*)?$ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/campaigns/([^/]+)/characters(/.*)?$ /campaigns/$1/characters$2 break;
            proxy_pass         http://$upstream_character:8003;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Campaign service — campanhas, sessões, GM actions
        location ~ ^/api/(campaigns|sessions|session)(/.*)?$ {
            limit_req zone=api burst=30 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://$upstream_campaign:8002;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Content-Type $content_type;
        }

        # Characters — POST base path (no trailing slash)
        location = /api/characters {
            limit_req zone=api burst=20 nodelay;
            rewrite ^ /characters break;
            proxy_pass         http://$upstream_character:8003;
            proxy_set_header   Host $host;
        }

        # Characters — sub-paths
        location /api/characters/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/characters/(.*) /characters/$1 break;
            proxy_pass         http://$upstream_character:8003;
            proxy_set_header   Host $host;
        }

        # Gateway — auth, roteamento geral
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass         http://$upstream_gateway:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket multiplayer
        location /ws/ {
            proxy_pass         http://$upstream_campaign:8002/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400;
        }

        # MinIO media
        location /media/ {
            rewrite ^/media/(.*) /$1 break;
            proxy_pass       http://$upstream_minio:9000;
            proxy_set_header Host minio:9000;
            proxy_buffering  off;
        }
    }
}
