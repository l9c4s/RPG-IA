server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $upstream_gateway    gateway;
    set $upstream_campaign   campaign_service;
    set $upstream_pdf        pdf_service;
    set $upstream_character  character_service;
    set $upstream_minio      minio;

    # Serve static assets with long-lived cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDF upload
    location /api/books/upload {
        client_max_body_size 100M;
        rewrite ^/api/books/(.*) /$1 break;
        proxy_pass         http://$upstream_pdf:8001;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
    }

    # PDF service
    location /api/books/ {
        rewrite ^/api/books/(.*) /$1 break;
        proxy_pass         http://$upstream_pdf:8001;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
    }

    # Campaign / sessions
    location ~ ^/api/(campaigns|sessions|session)(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$upstream_campaign:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Characters base path
    location = /api/characters {
        rewrite ^ /characters break;
        proxy_pass         http://$upstream_character:8003;
        proxy_set_header   Host $host;
    }

    # Characters sub-paths
    location /api/characters/ {
        rewrite ^/api/characters/(.*) /characters/$1 break;
        proxy_pass         http://$upstream_character:8003;
        proxy_set_header   Host $host;
    }

    # Gateway — auth e rotas gerais
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://$upstream_gateway:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket multiplayer
    location /ws/ {
        proxy_pass         http://$upstream_campaign:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400;
    }

    # MinIO media
    location /media/ {
        rewrite ^/media/(.*) /$1 break;
        proxy_pass         http://$upstream_minio:9000;
        proxy_set_header   Host minio:9000;
        proxy_buffering    off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"     always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin"  always;

    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;
}
